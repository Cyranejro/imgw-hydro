<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Wodowskazy Morskie IMGW</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f5;
            padding: 40px;
        }
        #dane {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            max-width: 700px;
        }
        .pole {
            margin-bottom: 10px;
            font-size: 18px;
        }
        .nazwa {
            font-weight: bold;
        }
        select {
            font-size: 18px;
            padding: 8px;
            margin-bottom: 20px;
        }
        #infoTop {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #003366;
        }
    </style>
</head>
<body>

<h2>Wodowskazy Morskie IMGW</h2>

<select id="wybor">
    <option value="154180090">Łeba</option>
    <option value="154180100">Władysławowo</option>
    <option value="154180120">Gdynia</option>
    <option value="154180140" selected>Gdańsk – Port Północny</option>
    <option value="154180010">Świnoujście</option>
    <option value="154180020">Szczecin</option>
</select>

<div id="infoTop">
    Stan wodowskazu: ...<br>
    Rzędna zera wodowskazu: ...
</div>

<div id="dane">Pobieranie danych...</div>

<script>
async function pobierzDane(id) {
    try {
        // Informacja dla użytkownika o ładowaniu
        document.getElementById("dane").innerHTML = "Pobieranie aktualnych danych...";
        
        // Twój działający adres Cloudflare Worker
        const workerUrl = "https://imgw-hydro.arturcyran1994.workers.dev?id=" + id;

        const response = await fetch(workerUrl);

        if (!response.ok) {
            throw new Error(`Błąd HTTP: ${response.status}`);
        }

        const dane = await response.json();

        // Sprawdzenie czy w odpowiedzi nie ma błędu zwróconego przez Worker
        if (dane.error) {
            throw new Error(dane.error);
        }

        // Górne informacje
        document.getElementById("infoTop").innerHTML =
            "Stan wodowskazu: " + (dane.stan_wody !== null && dane.stan_wody !== undefined ? dane.stan_wody + " cm" : "Brak danych") + "<br>" +
            "Rzędna zera wodowskazu: " + (dane.rzedna_zerawodowskazu !== null && dane.rzedna_zerawodowskazu !== undefined ? dane.rzedna_zerawodowskazu + " m" : "Brak danych");

        // Wypełnienie parametrów
        let html = "";
        for (const klucz in dane) {
            html += `
                <div class="pole">
                    <span class="nazwa">${klucz}:</span>
                    <span>${dane[klucz] !== null ? dane[klucz] : 'brak'}</span>
                </div>
            `;
        }
        document.getElementById("dane").innerHTML = html;

    } catch (e) {
        document.getElementById("dane").innerHTML = "Błąd pobierania danych: " + e.message;
        console.error("Szczegóły błędu:", e);
    }
}

// Nasłuchiwanie zmiany wyboru w menu select
document.getElementById("wybor").addEventListener("change", function() {
    pobierzDane(this.value);
});

// Pobranie danych dla domyślnej stacji po załadowaniu strony
pobierzDane(document.getElementById("wybor").value);
</script>

</body>
</html>
