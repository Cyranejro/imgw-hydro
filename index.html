<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wodowskazy Morskie IMGW</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f5;
            padding: 40px;
        }
        #dane {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            max-width: 700px;
        }
        .pole {
            margin-bottom: 10px;
            font-size: 18px;
        }
        .nazwa {
            font-weight: bold;
        }
        select {
            font-size: 18px;
            padding: 8px;
            margin-bottom: 20px;
        }
        #infoTop {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #003366;
        }
        .error {
            color: #d9534f;
            font-weight: bold;
        }
    </style>
</head>
<body>

<h2>Wodowskazy Morskie IMGW</h2>

<select id="wybor">
    <option value="154180090">Łeba</option>
    <option value="154180100">Władysławowo</option>
    <option value="154180120">Gdynia</option>
    <option value="154180140" selected>Gdańsk – Port Północny</option>
    <option value="154180010">Świnoujście</option>
    <option value="154180020">Szczecin</option>
</select>

<div id="infoTop">
    Stan wodowskazu: ...<br>
    Rzędna zera wodowskazu: ...
</div>

<div id="dane">Ładowanie danych...</div>

<script>
async function pobierzDane(id) {
    const daneElement = document.getElementById("dane");
    const infoTopElement = document.getElementById("infoTop");

    try {
        daneElement.innerHTML = "Pobieranie aktualnych danych...";

        const workerUrl = "https://imgw-hydro.arturcyran1994.workers.dev?id=" + id;
        const response = await fetch(workerUrl);

        // Zabezpieczenie: Sprawdzenie, czy odpowiedź serwera to faktycznie JSON
        const contentType = response.headers.get("content-type");
        if (!contentType || !contentType.includes("application/json")) {
            throw new Error("Worker zwrócił kod HTML/tekst zamiast danych JSON. Upewnij się, że opublikowałeś (Deploy) kod w Cloudflare.");
        }

        if (!response.ok) {
            throw new Error(`Błąd HTTP: ${response.status}`);
        }

        const dane = await response.json();

        if (dane.error) {
            throw new Error(dane.error);
        }

        // Górne, podsumowujące informacje
        const stanWody = (dane.stan_wody !== null && dane.stan_wody !== undefined) ? dane.stan_wody + " cm" : "Brak danych";
        const rzedna = (dane.rzedna_zerawodowskazu !== null && dane.rzedna_zerawodowskazu !== undefined) ? dane.rzedna_zerawodowskazu + " m" : "Brak danych";

        infoTopElement.innerHTML = `
            Stan wodowskazu: ${stanWody}<br>
            Rzędna zera wodowskazu: ${rzedna}
        `;

        // Generowanie pełnej listy ze wszystkimi parametrami
        let html = "";
        for (const klucz in dane) {
            html += `
                <div class="pole">
                    <span class="nazwa">${klucz}:</span>
                    <span>${dane[klucz] !== null ? dane[klucz] : 'brak'}</span>
                </div>
            `;
        }
        daneElement.innerHTML = html;

    } catch (e) {
        daneElement.innerHTML = `<span class="error">Błąd pobierania danych: ${e.message}</span>`;
        console.error("Szczegóły błędu:", e);
    }
}

// Nasłuchiwanie na zmianę stacji na liście
document.getElementById("wybor").addEventListener("change", function() {
    pobierzDane(this.value);
});

// Pobranie danych na start po załadowaniu strony
pobierzDane(document.getElementById("wybor").value);
</script>

</body>
</html>
