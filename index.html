<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Wodowskazy Morskie IMGW</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f5;
            padding: 40px;
        }
        #dane {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            max-width: 700px;
        }
        .pole {
            margin-bottom: 10px;
            font-size: 18px;
        }
        .nazwa {
            font-weight: bold;
        }
        select {
            font-size: 18px;
            padding: 8px;
            margin-bottom: 20px;
        }
        #nadMorzem {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #003366;
        }
    </style>
</head>
<body>

<h2>Wodowskazy Morskie IMGW</h2>

<select id="wybor">
    <option value="154180090">Łeba</option>
    <option value="154180100">Władysławowo</option>
    <option value="154180120">Gdynia</option>
    <option value="154180140">Gdańsk – Port Północny</option>
    <option value="154180010">Świnoujście</option>
    <option value="154180020">Szczecin</option>
</select>

<div id="nadMorzem">
    powyżej średniego poziomu morza: brak danych IMGW do obliczeń
</div>

<div id="dane">Wybierz wodowskaz...</div>

<script>
async function pobierzDane(id) {
    try {
        const url = "https://danepubliczne.imgw.pl/api/data/hydro/id/" + id + "/format/json";

        const response = await fetch(url);   // <-- tu przeglądarka zablokuje CORS
        const json = await response.json();

        const dane = json[0];

        let html = "";
        for (const klucz in dane) {
            html += `
                <div class="pole">
                    <span class="nazwa">${klucz}:</span>
                    <span>${dane[klucz]}</span>
                </div>
            `;
        }

        document.getElementById("dane").innerHTML = html;

    } catch (e) {
        document.getElementById("dane").innerHTML = "Błąd pobierania danych (CORS).";
    }
}

document.getElementById("wybor").addEventListener("change", function() {
    pobierzDane(this.value);
});

// Domyślna stacja
pobierzDane("154180140");
</script>

</body>
</html>
